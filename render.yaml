services:
  - type: web
    name: library-management-system
    env: docker
    dockerfilePath: Dockerfile
    branch: main
    buildCommand: pnpm install && pnpm build
    startCommand: pnpm db:push && pnpm start
    envVars:
      - key: DATABASE_URL
        type: secret
      - key: JWT_SECRET
        type: secret
      - key: OWNER_OPEN_ID
        type: secret
      - key: OAUTH_SERVER_URL
        type: secret
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    plan: starter
    regions:
      - oregon
